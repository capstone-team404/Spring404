name: Collect safety facilities

on:
  push:
    branches: [main]
    paths:
      - 'backend/data/security-lights-input.csv'
  workflow_dispatch:
    inputs:
      source:
        description: '수집할 시설 (보안등만 저장하려면 security_light)'
        type: choice
        default: security_light
        options:
          - security_light
          - cctv
          - convenience
          - police
          - all
  schedule:
    # Tuesday 03:17 Asia/Seoul. Avoid the top-of-hour queue.
    - cron: '17 18 * * 1'

permissions:
  contents: read

concurrency:
  group: facility-collection
  cancel-in-progress: false

jobs:
  collect:
    # Enable after configuring credentials and the security-light source.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.FACILITY_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT || '4000' }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL: 'true'
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      STREETLIGHT_CSV_URL: ${{ vars.STREETLIGHT_CSV_URL }}
      STREETLIGHT_DATA_DATE: ${{ vars.STREETLIGHT_DATA_DATE }}
      SECURITY_LIGHT_CSV_URL: ${{ vars.SECURITY_LIGHT_CSV_URL }}
      SECURITY_LIGHT_DATA_DATE: ${{ vars.SECURITY_LIGHT_DATA_DATE }}
      HONGDAE_CENTER_LAT: ${{ vars.HONGDAE_CENTER_LAT || '37.5572' }}
      HONGDAE_CENTER_LNG: ${{ vars.HONGDAE_CENTER_LNG || '126.9245' }}
      GRID_RADIUS_KM: ${{ vars.GRID_RADIUS_KM || '1.0' }}
      GRID_LAT_SIZE: ${{ vars.GRID_LAT_SIZE || '0.0009' }}
      GRID_LNG_SIZE: ${{ vars.GRID_LNG_SIZE || '0.0011' }}
      POLICE_COLLECTION_RADIUS_M: ${{ vars.POLICE_COLLECTION_RADIUS_M || '2000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Convert uploaded light file and update DB
        if: github.event_name == 'push' || inputs.source == 'security_light' || inputs.source == 'all' || github.event_name == 'schedule'
        run: python update_security_lights.py --output-dir security-light-output
      - name: Collect selected source
        if: github.event_name != 'push' && inputs.source != 'security_light'
        env:
          SELECTED_SOURCE: ${{ inputs.source || 'all' }}
        run: |
          if [ "$SELECTED_SOURCE" = 'all' ]; then
            python collect_facilities.py --once --sources cctv streetlight convenience police
          else
            python collect_facilities.py --once --sources "$SELECTED_SOURCE"
          fi
      - name: Upload light conversion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-light-update-results
          path: backend/security-light-output/
          retention-days: 30
          if-no-files-found: ignore
      - name: Light update summary
        if: always()
        run: |
          if [ -f security-light-output/summary.json ]; then
            echo '### 보안등 파일 갱신 결과' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat security-light-output/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
